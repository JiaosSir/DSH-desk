name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  desk-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/desk-core -> target"
      - run: cargo fmt -p desk-core --check
      - run: cargo clippy -p desk-core -- -D warnings
      - run: cargo test -p desk-core

  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bridge:test
      - run: pnpm bridge:build

  shell-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm sidecar:assemble        # 组装 sidecar（node/pnpm 下载走 .downloads 缓存）
      - run: pnpm --dir apps/desktop tauri build --no-bundle
      - run: node scripts/smoke-desktop.mjs   # 冒烟：DSH_HOME=临时目录，无窗口自测
