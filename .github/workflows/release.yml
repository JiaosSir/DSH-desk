name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm bridge:test
      - run: pnpm bridge:build
      - name: 发布 bridge（版本已存在于 registry 时跳过；bridge 独立版本，不随 tag 派生）
        run: |
          VER=$(node -p "require('./packages/dsh-desk-bridge/package.json').version")
          if npm view "@cjiaojiao/dsh-desk-bridge@$VER" version >/dev/null 2>&1; then
            echo "bridge@$VER 已发布，跳过"
          else
            pnpm --filter @cjiaojiao/dsh-desk-bridge publish --access public --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-release:
    needs: publish-bridge
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      - name: 版本号由 tag 派生（tauri.conf + 壳包；bridge 独立版本不动）
        run: |
          node -e "const fs=require('fs');const p='apps/desktop/src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version=process.env.GITHUB_REF_NAME.replace(/^v/,'');fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')"
          node -e "const fs=require('fs');const p='apps/desktop/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.env.GITHUB_REF_NAME.replace(/^v/,'');fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
      - run: pnpm sidecar:assemble          # sidecar 组装（不含 bridge；bridge 首启经 npm 钉版装入 profile）
      - run: pnpm --dir apps/desktop tauri build --bundles nsis
      - run: node scripts/build-portable.mjs
      - run: node scripts/smoke-desktop.mjs # 冒烟（DSH_HOME=临时目录）
      - name: 生成 release notes（取 tag 消息；无则回退最近提交标题）
        shell: bash
        run: |
          NOTES="$(git tag -l --format='%(contents)' "${{ github.ref_name }}")"
          if [ -z "$NOTES" ]; then NOTES="$(git log -1 --format='%s')"; fi
          printf '%s\n' "$NOTES" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            target/release/bundle/nsis/*-setup.exe
            dist-portable/*.zip
