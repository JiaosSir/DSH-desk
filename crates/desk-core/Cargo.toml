[package]
name = "desk-core"
version = "1.0.0"
edition = "2021"
description = "desk-core: sidecar supervision, port negotiation, profile initialization, and rolling logs (no tauri dependency)"
license = "MIT"
publish = false

[dependencies]
dirs = "6"
dunce = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "time", "macros", "sync"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
