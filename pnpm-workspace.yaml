packages:
  - packages/*
  - apps/*

# pnpm ≥10 settings live here (the package.json "pnpm" field is ignored).
# esbuild's postinstall is explicitly declined: its platform binary arrives
# through the @esbuild/win32-x64 optional dependency and the package works
# without the lifecycle script.
allowBuilds:
  esbuild: false

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-client-connection@0.1.0-rc.8'
  - '@deepseek-ai/dsh-client-runtime@0.1.0-rc.8'
  - '@deepseek-ai/dsh-client-ui-settings@0.1.0-rc.8'
  - '@deepseek-ai/dsh-host-webserver@0.1.0-rc.8'
  - '@deepseek-ai/dsh-settings@0.1.0-rc.8'
  - '@deepseek-ai/dsh-system-prompt@0.1.0-rc.8'
