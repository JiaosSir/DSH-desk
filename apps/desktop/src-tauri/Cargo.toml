[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DeepSeek Harness desktop shell (Tauri 2)"
authors = ["dsh-desktop <dev@dsh-desktop.local>"]
edition = "2021"
license = "MIT"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
desktop-core = { path = "../../../crates/desktop-core" }
