<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>启动失败 — DeepSeek Harness</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #ffffff;
        color: #1f2329;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      }
      .mark {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        background: #fde8eb;
        color: #d03050;
      }
      h1 { font-size: 18px; font-weight: 600; margin: 0; }
      p { margin: 0; font-size: 13px; color: #6b7280; max-width: 480px; text-align: center; }
      pre {
        margin: 0;
        max-width: 560px;
        max-height: 200px;
        overflow: auto;
        font-size: 12px;
        color: #4b5563;
        background: #f6f7f9;
        border: 1px solid #e2e5ea;
        border-radius: 8px;
        padding: 10px 12px;
        white-space: pre-wrap;
      }
      #actions { display: flex; gap: 10px; margin-top: 8px; }
      button {
        padding: 6px 14px;
        font-size: 13px;
        border-radius: 6px;
        border: 1px solid #d6dbe3;
        background: transparent;
        color: #1f2329;
        cursor: pointer;
      }
      button:hover { background: #f2f4f7; }
    </style>
  </head>
  <body>
    <div class="mark">!</div>
    <h1>宿主启动失败</h1>
    <p id="reason">本地服务未能启动，请重试或查看日志。</p>
    <pre id="detail" hidden></pre>
    <div id="actions" hidden>
      <button id="retry">重试</button>
      <button id="logs">打开日志目录</button>
      <button id="quit">退出</button>
    </div>
    <script>
      const params = new URLSearchParams(location.search)
      const reason = params.get('reason')
      if (reason) {
        document.getElementById('reason').textContent = reason
      }
      const detail = params.get('detail')
      if (detail) {
        document.getElementById('detail').hidden = false
        document.getElementById('detail').textContent = detail
      }
      const bridge = window.__DSH_DESK__
      if (bridge && typeof bridge.quit === 'function') {
        document.getElementById('actions').hidden = false
        document.getElementById('retry').addEventListener('click', () => void bridge.restartHost())
        document.getElementById('logs').addEventListener('click', () => void bridge.openLogs())
        document.getElementById('quit').addEventListener('click', () => void bridge.quit())
      }
      // 轮询壳状态：重试成功后由本页 replace 到宿主（替换当前历史条目，返回
      // 键不回退到错误页/等待页，壳在资产页上会跳过 push 导航）；仍失败则
      // 刷新原因展示。
      if (bridge && typeof bridge.getState === 'function') {
        const poll = async () => {
          try {
            const state = await bridge.getState()
            if (state && state.phase === 'running' && state.url) {
              window.location.replace(state.url)
              return
            }
            if (state && state.phase === 'failed' && state.error && state.error !== reason) {
              document.getElementById('reason').textContent = state.error
            }
          } catch {
            // 忽略单次轮询失败。
          }
        }
        void poll()
        setInterval(() => void poll(), 250)
      }
    </script>
  </body>
</html>
