<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>启动失败 — DeepSeek Harness</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #0f1115;
        color: #d6dbe3;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      }
      .mark {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        background: #3a1f22;
        color: #ff8f98;
      }
      h1 { font-size: 18px; font-weight: 600; margin: 0; }
      p { margin: 0; font-size: 13px; color: #8b93a1; max-width: 480px; text-align: center; }
      pre {
        margin: 0;
        max-width: 560px;
        max-height: 200px;
        overflow: auto;
        font-size: 12px;
        color: #aeb6c2;
        background: #161a22;
        border: 1px solid #2a2f3a;
        border-radius: 8px;
        padding: 10px 12px;
        white-space: pre-wrap;
      }
      #actions { display: flex; gap: 10px; margin-top: 8px; }
      button {
        padding: 6px 14px;
        font-size: 13px;
        border-radius: 6px;
        border: 1px solid #2a2f3a;
        background: transparent;
        color: #d6dbe3;
        cursor: pointer;
      }
      button:hover { background: #1a1f28; }
    </style>
  </head>
  <body>
    <div class="mark">!</div>
    <h1>宿主启动失败</h1>
    <p id="reason">本地服务未能启动，请重试或查看日志。</p>
    <pre id="detail" hidden></pre>
    <div id="actions" hidden>
      <button id="retry">重试</button>
      <button id="logs">打开日志目录</button>
      <button id="quit">退出</button>
    </div>
    <script>
      const params = new URLSearchParams(location.search)
      const reason = params.get('reason')
      if (reason) {
        document.getElementById('reason').textContent = reason
      }
      const detail = params.get('detail')
      if (detail) {
        document.getElementById('detail').hidden = false
        document.getElementById('detail').textContent = detail
      }
      const bridge = window.__DSH_DESK__
      if (bridge && typeof bridge.quit === 'function') {
        document.getElementById('actions').hidden = false
        document.getElementById('retry').addEventListener('click', () => void bridge.restartHost())
        document.getElementById('logs').addEventListener('click', () => void bridge.openLogs())
        document.getElementById('quit').addEventListener('click', () => void bridge.quit())
      }
    </script>
  </body>
</html>
